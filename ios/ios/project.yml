name: Browser
options:
  bundleIdPrefix: com.unstablesmp
  deploymentTarget:
    iOS: "16.0"
  usesTabs: false
  indentWidth: 2
targets:
  Browser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unstablesmp.hub
        PRODUCT_NAME: Unstable SMP Hub
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
