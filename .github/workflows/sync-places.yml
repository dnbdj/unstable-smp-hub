name: sync place photos
on:
  push:
    paths:
      - ".github/workflows/sync-places.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the two place photos from the live site
        run: |
          mkdir -p art/places
          curl -fsSL "https://unstablesmp.freebuff.page/art/places/capital.webp" -o art/places/capital.webp
          curl -fsSL "https://unstablesmp.freebuff.page/art/places/purgatory.webp" -o art/places/purgatory.webp
          ls -l art/places
          git config user.name "photo sync"
          git config user.email "dnbdj123@gmail.com"
          git add art/places/capital.webp art/places/purgatory.webp
          if git diff --cached --quiet; then echo "already in sync"; else git commit -m "art: sync place photos from live site"; git push; fi
