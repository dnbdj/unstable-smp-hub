name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild -project ios/Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Browser.xcarchive" archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/browser-ios.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Browser.xcarchive/Products/Applications/Browser.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r browser-ios.ipa Payload
          ls -la "$RUNNER_TEMP/browser-ios.ipa"

      - name: Attach to ios release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ios --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create ios --repo "$GITHUB_REPOSITORY" \
                 --title "iOS" --notes "Unsigned iOS build. Sideload with AltStore or Sideloadly using a free Apple ID - see ios/README.md."
          gh release upload ios "$RUNNER_TEMP/browser-ios.ipa" --repo "$GITHUB_REPOSITORY" --clobber
