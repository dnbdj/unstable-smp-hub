name: Public aliases

# Disables SSO protection (public site) and points the short domains at
# production. Run manually: gh workflow run aliases.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make project public (disable SSO protection)
        env:
          VERCEL_TOKEN: ${{ secrets.OPENCODE_UNSTABLE_SMP_HUB }}
        run: |
          set -euo pipefail
          npx -y vercel@latest project protection disable unstablemp --sso || \
          npx -y vercel@latest project protection disable prj_iuTHhnXQOMkKuNR6iXJiyLDH5VgO --sso
          npx -y vercel@latest project protection unstablemp --format json || true

      - name: Resolve latest production deployment
        id: resolve
        env:
          VERCEL_TOKEN: ${{ secrets.OPENCODE_UNSTABLE_SMP_HUB }}
        run: |
          set -euo pipefail
          URL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_iuTHhnXQOMkKuNR6iXJiyLDH5VgO&target=production&limit=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.deployments[0].url)})')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "production deployment: $URL"

      - name: Assign short domains
        env:
          VERCEL_TOKEN: ${{ secrets.OPENCODE_UNSTABLE_SMP_HUB }}
        run: |
          set -euo pipefail
          npx -y vercel@latest alias set "${{ steps.resolve.outputs.url }}" unstablemp.vercel.app
          npx -y vercel@latest alias set "${{ steps.resolve.outputs.url }}" unstablesmp-hub.vercel.app