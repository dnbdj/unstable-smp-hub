name: Alias short domain

# Points unstablemp.vercel.app at the current production deployment.
# Run manually: gh workflow run alias.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve latest production deployment
        id: resolve
        env:
          VERCEL_TOKEN: ${{ secrets.OPENCODE_UNSTABLE_SMP_HUB }}
        run: |
          set -euo pipefail
          URL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_iuTHhnXQOMkKuNR6iXJiyLDH5VgO&target=production&limit=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.deployments[0].url)})')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "production deployment: $URL"

      - name: Assign unstablemp.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.OPENCODE_UNSTABLE_SMP_HUB }}
        run: npx -y vercel@latest alias set "${{ steps.resolve.outputs.url }}" unstablemp.vercel.app